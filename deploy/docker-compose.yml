# ============================================================
#  教育评估系统 — 生产部署 Docker Compose
#  用法: cp .env.example .env && docker compose up -d --build
# ============================================================

services:
  # ---------- 基础设施 ----------

  mysql:
    image: mysql:latest
    container_name: edu-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_evaluation}
      MYSQL_USER: ${MYSQL_USER:-edu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--sort-buffer-size=4M"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: edu-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: edu-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:latest
    container_name: edu-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ---------- 应用服务 ----------

  ai-worker:
    build:
      context: ../ai-worker
      dockerfile: Dockerfile
    container_name: edu-ai-worker
    environment:
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL}
      MODEL_API_KEY: ${MODEL_API_KEY}
      MODEL_PROVIDER_DRIVER: ${MODEL_PROVIDER_DRIVER:-openai-compatible}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-180}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-coursework-submissions}
      # 按需配置各模型
      TEXT_PROVIDER_NAME: ${TEXT_PROVIDER_NAME:-}
      TEXT_MODEL_NAME: ${TEXT_MODEL_NAME:-}
      VISION_PROVIDER_NAME: ${VISION_PROVIDER_NAME:-}
      VISION_MODEL_NAME: ${VISION_MODEL_NAME:-}
      MULTIMODAL_PROVIDER_NAME: ${MULTIMODAL_PROVIDER_NAME:-}
      MULTIMODAL_MODEL_NAME: ${MULTIMODAL_MODEL_NAME:-}
      ASR_PROVIDER_NAME: ${ASR_PROVIDER_NAME:-}
      ASR_MODEL_NAME: ${ASR_MODEL_NAME:-}
      OCR_PROVIDER_NAME: ${OCR_PROVIDER_NAME:-}
      OCR_MODEL_NAME: ${OCR_MODEL_NAME:-}
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: edu-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-edu_evaluation}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-edu}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-edu}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      APP_AI_WORKER_BASE_URL: http://ai-worker:8000
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      APP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      APP_STORAGE_BUCKET: ${MINIO_BUCKET:-coursework-submissions}
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: edu-frontend
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  minio_data:
  rabbitmq_data:
