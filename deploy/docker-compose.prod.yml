# ============================================================
#  教育评估系统 — 生产环境 Docker Compose
#  用法: docker compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:
  # ---------- 基础设施 ----------

  mysql:
    image: registry.cn-hangzhou.aliyuncs.com/library/mysql:8.4
    container_name: edu-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_evaluation}
      MYSQL_USER: ${MYSQL_USER:-edu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: [
      "--character-set-server=utf8mb4",
      "--collation-server=utf8mb4_unicode_ci",
      "--sort-buffer-size=4M",
      "--max-connections=200",
      "--innodb-buffer-pool-size=512M"
    ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: registry.cn-hangzhou.aliyuncs.com/library/redis:7.4-alpine
    container_name: edu-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: edu-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  rabbitmq:
    image: registry.cn-hangzhou.aliyuncs.com/library/rabbitmq:4.0-management
    container_name: edu-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edu}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ---------- 应用服务 ----------

  ai-worker:
    build:
      context: ../ai-worker
      dockerfile: Dockerfile
    container_name: edu-ai-worker
    environment:
      # 模型配置
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL}
      MODEL_API_KEY: ${MODEL_API_KEY}
      MODEL_PROVIDER_DRIVER: ${MODEL_PROVIDER_DRIVER:-openai-compatible}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-180}
      # MinIO 配置
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-coursework-submissions}
      # 模型名称
      TEXT_PROVIDER_NAME: ${TEXT_PROVIDER_NAME:-}
      TEXT_MODEL_NAME: ${TEXT_MODEL_NAME:-}
      VISION_PROVIDER_NAME: ${VISION_PROVIDER_NAME:-}
      VISION_MODEL_NAME: ${VISION_MODEL_NAME:-}
      MULTIMODAL_PROVIDER_NAME: ${MULTIMODAL_PROVIDER_NAME:-}
      MULTIMODAL_MODEL_NAME: ${MULTIMODAL_MODEL_NAME:-}
      ASR_PROVIDER_NAME: ${ASR_PROVIDER_NAME:-}
      ASR_MODEL_NAME: ${ASR_MODEL_NAME:-}
      OCR_PROVIDER_NAME: ${OCR_PROVIDER_NAME:-}
      OCR_MODEL_NAME: ${OCR_MODEL_NAME:-}
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: edu-backend
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod
      # 数据库
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-edu_evaluation}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-edu}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-edu}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # AI Worker
      APP_AI_WORKER_BASE_URL: http://ai-worker:8000
      # MinIO
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      APP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      APP_STORAGE_BUCKET: ${MINIO_BUCKET:-coursework-submissions}
      # JVM 参数
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: registry.cn-hangzhou.aliyuncs.com/library/nginx:1.27-alpine
    container_name: edu-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  nginx_logs:
