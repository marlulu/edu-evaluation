# ============================================================
#  Spring Boot 生产环境配置
#  激活方式: SPRING_PROFILES_ACTIVE=prod
# ============================================================

server:
  port: 8080
  tomcat:
    max-threads: 200
    min-spare-threads: 20
    accept-count: 100
    max-connections: 8192
    connection-timeout: 20000

spring:
  application:
    name: edu-evaluation-backend

  # 数据库配置（通过环境变量覆盖）
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/edu_evaluation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:edu}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Redis 配置
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: true

# 应用配置
app:
  env:
    path: ${APP_ENV_PATH:/app/.env}
  upload-dir: data/uploads
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${APP_STORAGE_BUCKET:coursework-submissions}
    access-key: ${APP_STORAGE_ACCESS_KEY:minio}
    secret-key: ${APP_STORAGE_SECRET_KEY:minio_password}
  ai-worker:
    base-url: ${APP_AI_WORKER_BASE_URL:http://localhost:8000}
    capabilities-path: /parse/capabilities
    parse-task-path: /parse/tasks
    provider-registry-path: /parse/providers
    evaluation-capabilities-path: /evaluate/capabilities
    evaluation-task-path: /evaluate/tasks
    evaluation-review-path: /evaluate/reviews
    timeout-seconds: 300
    connect-timeout-seconds: 10

# 日志配置
logging:
  level:
    root: INFO
    com.example.eduevaluation: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/backend/application.log
