server:
  port: 8080

spring:
  application:
    name: edu-evaluation-backend
  datasource:
    url: jdbc:mysql://localhost:13306/edu_evaluation?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: edu
    password: edu_password
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: -1
      max-request-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    jwt-secret: ${APP_AUTH_JWT_SECRET:change-this-local-development-jwt-secret-to-a-long-random-value}
    token-hours: 8
  upload-dir: data/uploads
  storage:
    endpoint: http://localhost:9000
    bucket: coursework-submissions
    access-key: minio
    secret-key: minio_password
  ai-worker:
    base-url: http://localhost:8001
    capabilities-path: /parse/capabilities
    parse-task-path: /parse/tasks
    provider-registry-path: /parse/providers
    evaluation-capabilities-path: /evaluate/capabilities
    evaluation-task-path: /evaluate/tasks
    evaluation-review-path: /evaluate/reviews
    timeout-seconds: 120
    connect-timeout-seconds: 10
    config-token: ${AI_WORKER_CONFIG_TOKEN:}
