services:
  mysql:
    image: mysql:8.4
    container_name: edu-evaluation-mysql
    environment:
      MYSQL_DATABASE: edu_evaluation
      MYSQL_USER: edu
      MYSQL_PASSWORD: edu_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--sort-buffer-size=4M"]

  redis:
    image: redis:7.4-alpine
    container_name: edu-evaluation-redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: edu-evaluation-minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"

  rabbitmq:
    image: rabbitmq:4.0-management
    container_name: edu-evaluation-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: edu
      RABBITMQ_DEFAULT_PASS: edu_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
